<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SRISHTI ENTERPRISES - Scratch Coupon</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#172033;display:flex;min-height:100vh;align-items:center;justify-content:center}
.card{width:min(92%,420px);background:#fff;border-radius:24px;padding:24px;box-shadow:0 12px 35px #0002;text-align:center}
h1{margin:5px 0;font-size:27px}.sub{color:#687386}.box{margin:22px auto;width:290px;height:170px;border-radius:18px;position:relative;overflow:hidden;background:linear-gradient(135deg,#ffcf33,#ff8a00);display:flex;align-items:center;justify-content:center}
.gift{font-size:27px;font-weight:800;padding:15px}.cover{position:absolute;inset:0;background:#777;display:flex;align-items:center;justify-content:center;color:white;font-size:24px;font-weight:800;cursor:pointer;user-select:none}
small{color:#6c7482}.btn{display:inline-block;background:#16843b;color:white;border:0;border-radius:12px;padding:12px 18px;margin-top:12px;text-decoration:none;font-weight:700}
.err{color:#b42318}.ok{color:#067647}
</style></head>
<body><div class="card">
<div style="font-size:42px">🎁</div>
<h1>SRISHTI ENTERPRISES</h1><div class="sub">Special Scratch Coupon</div>
<div id="status"></div>
<div class="box"><div class="gift" id="gift">🎉 आपका Gift</div><div class="cover" id="cover">SCRATCH HERE ✨</div></div>
<div id="code"></div><small>एक coupon केवल एक बार redeem किया जा सकता है।</small>
</div>
<script>
const code=new URLSearchParams(location.search).get("code");
const status=document.getElementById("status"), gift=document.getElementById("gift"), cover=document.getElementById("cover"), codeEl=document.getElementById("code");
let currentGift="";
if(!code){status.innerHTML='<p class="err">Coupon code नहीं मिला। WhatsApp से मिला पूरा link खोलें।</p>';cover.style.display="none";}
else{
 fetch("/api/coupon/"+encodeURIComponent(code)).then(r=>r.json()).then(d=>{
   if(!d.ok){status.innerHTML='<p class="err">Invalid coupon.</p>';cover.style.display="none";return;}
   currentGift=d.gift; codeEl.textContent="Coupon: "+d.code;
   if(d.used){status.innerHTML='<p class="err">यह coupon पहले ही इस्तेमाल हो चुका है।</p>';cover.style.display="none";}
 });
}
cover.onclick=async()=>{
 if(!currentGift)return;
 const r=await fetch("/api/redeem",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({code})});
 const d=await r.json();
 if(d.ok){gift.textContent="🎉 "+d.gift;cover.style.display="none";status.innerHTML='<p class="ok">बधाई हो! आपका gift मिल गया।</p>';}
 else {status.innerHTML='<p class="err">'+(d.message||"Coupon error")+'</p>';cover.style.display="none";}
};
</script></body></html>
