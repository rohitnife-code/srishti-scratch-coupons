<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SRISHTI ENTERPRISES - Admin</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 font-family:Arial,sans-serif;
 background:linear-gradient(135deg,#eef3ff,#fff4df);
 min-height:100vh;
 padding:25px 15px;
}

.box{
 max-width:500px;
 margin:auto;
 background:white;
 padding:25px;
 border-radius:25px;
 box-shadow:0 10px 35px rgba(0,0,0,.15);
}

h1{
 text-align:center;
 color:#172033;
}

label{
 display:block;
 margin-top:18px;
 font-weight:bold;
}

input,select{
 width:100%;
 padding:14px;
 margin-top:7px;
 border:1px solid #ccd2dc;
 border-radius:10px;
 font-size:16px;
}

button{
 width:100%;
 margin-top:20px;
 padding:15px;
 border:0;
 border-radius:12px;
 background:#16a34a;
 color:white;
 font-size:18px;
 font-weight:bold;
}

#result{
 margin-top:20px;
 padding:15px;
 background:#f2f7ff;
 border-radius:12px;
 display:none;
}

.link{
 word-break:break-all;
 color:#174ea6;
}

.small{
 color:#667085;
 font-size:14px;
 text-align:center;
 margin-top:20px;
}
</style>
</head>

<body>

<div class="box">

<h1>🎁 SRISHTI ENTERPRISES</h1>

<p style="text-align:center">
Scratch Coupon Admin Panel
</p>

<label>Coupon Code</label>
<input
 id="code"
 type="text"
 placeholder="जैसे SRISHTI001"
>

<label>Gift</label>

<select id="gift">
<option>🎁 Special Gift</option>
<option>🎉 Lucky Gift</option>
<option>⭐ Lucky Winner Gift</option>
<option>🥳 Surprise Gift</option>
</select>

<button onclick="makeCoupon()">
🔗 Coupon Link बनाएं
</button>

<div id="result">

<b>आपका Coupon Link:</b>

<p class="link" id="link"></p>

<button onclick="copyLink()">
📋 Link Copy करें
</button>

<button onclick="whatsapp()">
📲 WhatsApp पर भेजें
</button>

</div>

<p class="small">
SRISHTI ENTERPRISES • Maharajganj
</p>

</div>

<script>

let couponLink="";

function makeCoupon(){

 let code=document.getElementById("code").value.trim();

 if(code===""){
   alert("पहले Coupon Code डालें");
   return;
 }

 code=code.toUpperCase();

 couponLink =
 "https://rohitnife-code.github.io/srishti-scratch-coupons/?code="
 + encodeURIComponent(code);

 document.getElementById("link").textContent =
 couponLink;

 document.getElementById("result").style.display="block";
}


function copyLink(){

 navigator.clipboard.writeText(couponLink);

 alert("Coupon Link Copy हो गया ✅");
}


function whatsapp(){

 if(!couponLink){
   alert("पहले Coupon Link बनाएं");
   return;
 }

 let message =
 "🎁 SRISHTI ENTERPRISES का Special Scratch Coupon!\n\n"
 +"अपना Gift देखने के लिए नीचे दिए गए Link को खोलें:\n\n"
 +couponLink
 +"\n\n🎉 शुभकामनाएँ!";

 let url =
 "https://wa.me/?text="
 +encodeURIComponent(message);

 window.open(url,"_blank");
}

</script>

</body>
</html>
