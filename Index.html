<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SRISHTI ENTERPRISES - Scratch Coupon</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#eef3ff,#fff4df);
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:18px;
}

.card{
width:100%;
max-width:520px;
background:#fff;
border-radius:28px;
padding:28px 18px;
text-align:center;
box-shadow:0 15px 45px rgba(0,0,0,.15);
}

.gift{
font-size:64px;
}

h1{
margin:8px 0;
font-size:30px;
color:#172033;
}

.sub{
font-size:19px;
color:#667085;
margin-bottom:15px;
}

.msg{
font-size:18px;
color:#b42318;
line-height:1.5;
margin:16px 0;
}

.scratch{
position:relative;
width:100%;
height:220px;
margin:22px auto;
border-radius:22px;
overflow:hidden;
box-shadow:0 8px 20px rgba(0,0,0,.15);
}

.reward{
width:100%;
height:100%;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#fff0a8,#ffd166);
padding:15px;
}

.reward .emoji{
font-size:50px;
}

.reward h2{
margin:7px 0;
font-size:27px;
}

.reward p{
margin:5px;
font-size:19px;
}

canvas{
position:absolute;
inset:0;
width:100%;
height:100%;
cursor:pointer;
touch-action:none;
}

.hint{
color:#667085;
font-size:16px;
margin:8px;
}

.code{
font-size:14px;
color:#667085;
margin-top:15px;
}

.footer{
margin-top:20px;
color:#777;
font-size:14px;
}
</style>
</head>

<body>

<div class="card">

<div class="gift">🎁</div>

<h1>SRISHTI ENTERPRISES</h1>

<div class="sub">
Special Scratch Coupon
</div>

<div id="msg" class="msg">
अपना Gift देखने के लिए नीचे Scratch करें 🎉
</div>

<div class="scratch" id="box">

<div class="reward">

<div class="emoji">🎁</div>

<h2>🎉 बधाई हो!</h2>

<p id="product">
आपका Gift
</p>

<p id="qty"></p>

</div>

<canvas id="canvas"></canvas>

</div>

<div class="hint">
👆 उंगली से Scratch करें
</div>

<div class="code" id="code"></div>

<div class="footer">
SRISHTI ENTERPRISES • Maharajganj
</div>

</div>


<script>

const params =
new URLSearchParams(window.location.search);

const code =
params.get("code");

const product =
params.get("gift");

const qty =
params.get("qty") || "1";

const msg =
document.getElementById("msg");

const productEl =
document.getElementById("product");

const qtyEl =
document.getElementById("qty");

const codeEl =
document.getElementById("code");


/* Coupon check */

if(!code || !product){

msg.textContent =
"⚠️ Coupon link सही नहीं है। WhatsApp से मिला पूरा coupon link खोलें.";

}else{

productEl.textContent =
product;

qtyEl.textContent =
"Quantity: " + qty;

codeEl.textContent =
"Coupon Code: " + code;

}


/* Scratch Card */

const canvas =
document.getElementById("canvas");

const box =
document.getElementById("box");

const ctx =
canvas.getContext("2d");

let active = false;

let revealed = false;


function setupCanvas(){

canvas.width =
box.clientWidth;

canvas.height =
box.clientHeight;

ctx.globalCompositeOperation =
"source-over";

ctx.fillStyle =
"#aeb4bd";

ctx.fillRect(
0,
0,
canvas.width,
canvas.height
);

ctx.fillStyle =
"#667085";

ctx.font =
"bold 27px Arial";

ctx.textAlign =
"center";

ctx.textBaseline =
"middle";

ctx.fillText(
"SCRATCH HERE 🎁",
canvas.width / 2,
canvas.height / 2
);

}

setupCanvas();


window.addEventListener(
"resize",
setupCanvas
);


function getPoint(e){

const rect =
canvas.getBoundingClientRect();

return {

x:e.clientX - rect.left,

y:e.clientY - rect.top

};

}


function scratch(x,y){

if(revealed)
return;

ctx.globalCompositeOperation =
"destination-out";

ctx.beginPath();

ctx.arc(
x,
y,
27,
0,
Math.PI * 2
);

ctx.fill();

checkReveal();

}


function checkReveal(){

const data =
ctx.getImageData(
0,
0,
canvas.width,
canvas.height
).data;

let clear = 0;

for(
let i=3;
i<data.length;
i+=4
){

if(data[i] < 80){
clear++;
}

}

const percentage =
clear / (data.length / 4) * 100;

if(percentage >= 42){

revealGift();

}

}


function revealGift(){

if(revealed)
return;

revealed = true;

canvas.style.display =
"none";

msg.textContent =
"🎊 बधाई हो! आपका Scratch Coupon खुल गया!";

}


/* Mobile + Computer */

canvas.addEventListener(
"pointerdown",
function(e){

active = true;

const p =
getPoint(e);

scratch(
p.x,
p.y
);

}
);


canvas.addEventListener(
"pointermove",
function(e){

if(!active)
return;

const p =
getPoint(e);

scratch(
p.x,
p.y
);

}
);


window.addEventListener(
"pointerup",
function(){

active = false;

}
);

</script>

</body>
</html>
